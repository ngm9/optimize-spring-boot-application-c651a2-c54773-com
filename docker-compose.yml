services:
  video-encoding-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - THREAD_POOL_SIZE=8
      - DATABASE_URL=jdbc:postgresql://db:5432/videojobs
      - DATABASE_USER=appuser
      - DATABASE_PASS=securepass
    # resource limits, healthcheck, restart policy, volumes, and logging driver need configuration
    depends_on:
      - db
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: securepass
      POSTGRES_DB: videojobs
    ports:
      - "5432:5432"
    # volume and resource constraints need configuration
